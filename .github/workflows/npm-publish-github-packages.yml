# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must satisfy the engines.node floor in package.json (>=22.18.0). The build script
          # and the tests use Node 22 APIs, so pinning the major is what keeps CI honest: a
          # Node 20 runner would fail on the first step that touches them.
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The scope must match the package name's scope, otherwise the auth line
          # setup-node writes does not cover the scope being published.
          registry-url: https://npm.pkg.github.com/lsy1998/
      - run: npm ci
      # GitHub Packages defaults a first publish to private; this plugin is public.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
